name: Update change log

# Every push to main (i.e. every merged PR) regenerates docs/changelog.html
# from git history, so each shipped pull request lands as a dated entry.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Skip the run we trigger ourselves, to avoid an infinite loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — the changelog is built from git log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate change log
        run: python3 scripts/build-changelog.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain docs/changelog.html)" ]]; then
            echo "No changelog changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.html
          git commit -m "docs: refresh change log [skip ci]"
          git push
